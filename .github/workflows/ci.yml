name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Toolchain
        run: moon version --all
      - name: Update the package registry
        run: moon update
      - name: Format
        run: moon fmt --check
      - name: Check
        run: moon check --deny-warn
      - name: Test (wasm-gc)
        run: moon test --target wasm-gc
      - name: Test (js)
        run: moon test --target js
      - name: Test (native)
        run: moon test --target native
      - name: Build the CLI
        run: moon build --target native cmd/vl2svg

  fixtures:
    # The committed fixtures must be exactly what the pinned official packages produce.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Regenerate fixtures
        working-directory: scripts
        run: |
          npm ci
          npm run fixtures
      - name: Format the generated sources like the committed ones
        run: |
          moon update
          moon fmt
      # util/pow10_table.mbt (V8's Math.pow(10, k)) regenerates differently on this runner than on
      # the Windows machine that produced the committed file, so it is not compared here.
      - name: Fixtures are up to date
        run: |
          if ! git diff --quiet -- fixtures scale util ':!util/pow10_table.mbt'; then
            files=$(git diff --name-only -- fixtures scale util ':!util/pow10_table.mbt' | paste -sd, -)
            echo "::error::fixtures differ: $files"
            git diff -- fixtures scale util ':!util/pow10_table.mbt' | head -60
            exit 1
          fi
