name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install MoonBit (Linux, macOS)
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Install MoonBit (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          Add-Content -Path $env:GITHUB_PATH -Value "$env:USERPROFILE\.moon\bin"
      - name: Toolchain
        run: moon version --all
      - name: Update the package registry
        run: moon update
      - name: Format
        run: moon fmt --check
      - name: Check
        run: moon check --deny-warn
      - name: Test (wasm-gc)
        run: moon test --target wasm-gc
      - name: Test (js)
        run: moon test --target js
      - name: Test (native)
        run: moon test --target native
      - name: Build (all targets)
        run: moon build --target all
      - name: README examples
        shell: bash
        run: |
          (cd examples/hello && moon run cmd > "$RUNNER_TEMP/hello.svg")
          head -c 4 "$RUNNER_TEMP/hello.svg" | grep -q '<svg'
          moon run cmd/vl2svg --target native -- examples/bar_basic.vl.json "$RUNNER_TEMP/bar.svg"
          head -c 4 "$RUNNER_TEMP/bar.svg" | grep -q '<svg'
      - name: LLM feedback example
        shell: bash
        run: |
          (cd examples/llm_feedback && moon test -p sayoi7799/llm_feedback/feedback --target native && moon run cmd | tail -1)
          test "$(ls examples/llm_feedback/out/*.svg | wc -l)" -eq 3
          test "$(ls examples/llm_feedback/out/*.feedback.txt | wc -l)" -eq 3
      - name: The committed outputs of the example are current
        if: runner.os == 'Linux'
        run: git diff --exit-code -- examples/llm_feedback/out
      - name: Interface files are up to date
        run: |
          moon info
          git diff --exit-code -- '*.mbti'

  fixtures:
    # The committed fixtures must be exactly what the pinned official packages produce.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Regenerate fixtures
        working-directory: scripts
        run: |
          npm ci
          npm run fixtures
          npm run site-examples
      - name: Format the generated sources like the committed ones
        run: |
          moon update
          moon fmt
      - name: Fixtures are up to date
        run: |
          if ! git diff --quiet -- fixtures scale util site; then
            files=$(git diff --name-only -- fixtures scale util site | paste -sd, -)
            echo "::error::fixtures differ: $files"
            git diff -- fixtures scale util site | head -60
            exit 1
          fi
